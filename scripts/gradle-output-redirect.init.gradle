// Used only by Maina's local verification/release scripts. Generated Gradle,
// AGP, and CMake outputs stay outside the repository and its sync filesystem.
def mainaStorageRoot = new File('/Volumes/DivaySSD/MainaBuild').canonicalFile
def configuredOutputRoot = System.getenv('MAINA_ANDROID_OUTPUT_ROOT')
def mainaOutputRoot = configuredOutputRoot == null ? null : new File(configuredOutputRoot).canonicalFile
if (mainaOutputRoot == null || !mainaOutputRoot.path.startsWith(mainaStorageRoot.path + File.separator)) {
  throw new GradleException('MAINA_ANDROID_OUTPUT_ROOT must be supplied by the guarded Maina environment.')
}
gradle.beforeProject { project ->
    // Keep Maina-owned outputs outside the checkout, but leave third-party
    // node_modules packages on their default build directories. Reanimated,
    // Worklets, Gesture Handler and some codegen modules deliberately resolve
    // generated CMake files relative to their package-local `android/build`.
    // Redirecting every Gradle subproject makes a clean install compile until
    // CMake, then fail because those generated paths no longer exist.
    //
    // Expo owns generated autolinking metadata at android/build, so the root
    // project retains that path through the guarded external symlink restored
    // by the shell wrapper. Maina-owned app/module outputs use this root.
    if (project.path in [':app', ':maina-recorder']) {
      def name = project.path.replaceAll('[^A-Za-z0-9_.-]', '_')
      project.layout.buildDirectory.set(new File(mainaOutputRoot, name))
    }
}
